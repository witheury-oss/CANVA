<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍓 Recap Canva Eurydice 🍓</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5; /* Lavender blush */
            --primary: #ff4d6d; /* Strawberry pink */
            --secondary: #ffb3c6; /* Soft pink */
            --text-main: #5c1a2e; /* Dark pinkish brown */
            --card-bg: #ffffff;
            --danger: #ff3333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--secondary) 15%, transparent 15%);
            background-size: 25px 25px;
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            text-shadow: 2px 2px 0px white;
            margin-bottom: 20px;
        }

        /* Form Style */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.15);
            border: 3px solid var(--secondary);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 800;
            color: var(--primary);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--secondary);
            border-radius: 15px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: #fff9fa;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(255, 77, 109, 0.2);
        }

        /* Buttons */
        button {
            font-weight: 800;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            margin-top: 10px;
        }
        
        .btn-submit:active {
            transform: scale(0.95);
        }

        .btn-copy {
            background-color: var(--secondary);
            color: var(--text-main);
            flex: 1;
        }
        .btn-delete {
            background-color: #ff6b81;
            color: white;
            flex: 1;
        }

        /* Notifikasi Warning */
        .notif-container {
            background: #ffe6e6;
            border: 3px dashed var(--danger);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            display: none; /* Hidden by default */
        }

        .notif-title {
            color: var(--danger);
            margin-top: 0;
            font-size: 1.2rem;
            animation: blink 1.2s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; text-shadow: 0 0 10px rgba(255,51,51,0.5); }
            to { opacity: 0.5; text-shadow: none; }
        }

        /* Data List Style */
        .group-title {
            background: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        .data-item {
            background: var(--card-bg);
            border: 2px solid var(--secondary);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .data-item p {
            margin: 5px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .data-item strong {
            color: var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .expired-badge {
            background: var(--danger);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍓 Recap Canva Eurydice 🍓</h1>

        <!-- Area Notifikasi Khusus Expired -->
        <div id="notifArea" class="notif-container">
            <h2 class="notif-title">🚨 PENGINGAT HARI INI 🚨<br>HARUS KELUAR TEAM!</h2>
            <div id="notifList"></div>
        </div>

        <!-- Form Input -->
        <div class="card">
            <form id="recapForm">
                <div class="form-group">
                    <label>Nama Team 🍓</label>
                    <input type="text" id="nama_team" placeholder="Contoh: Team Ceria" required>
                </div>
                <div class="form-group">
                    <label>Nomor Customer 📱</label>
                    <input type="tel" id="nomor_cust" placeholder="08123456789" required>
                </div>
                <div class="form-group">
                    <label>Email Customer ✉️</label>
                    <input type="email" id="email_cust" placeholder="customer@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Durasi ⏳</label>
                    <select id="durasi" required>
                        <option value="1 bulan">1 Bulan</option>
                        <option value="2 bulan">2 Bulan</option>
                        <option value="3 bulan">3 Bulan</option>
                        <option value="6 bulan">6 Bulan</option>
                        <option value="1 tahun">1 Tahun</option>
                        <option value="lifetime">Lifetime</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tanggal Pembelian 📅</label>
                    <input type="date" id="tgl_beli" required>
                </div>
                <button type="submit" class="btn-submit">Simpan Data 🍰</button>
            </form>
        </div>

        <!-- Area Data Dikelompokkan -->
        <div id="dataArea"></div>
    </div>

    <script>
        // Inisialisasi Data dari Local Storage
        let dataCanva = JSON.parse(localStorage.getItem('dataCanvaEurydice')) || [];
        const form = document.getElementById('recapForm');
        
        // Set Default Tanggal Pembelian = Hari Ini
        document.getElementById('tgl_beli').valueAsDate = new Date();

        // Fungsi Menghitung Tanggal Selesai
        function hitungTglSelesai(tglBeli, durasi) {
            if (durasi === 'lifetime') return 'Lifetime';
            
            let date = new Date(tglBeli);
            switch(durasi) {
                case '1 bulan': date.setMonth(date.getMonth() + 1); break;
                case '2 bulan': date.setMonth(date.getMonth() + 2); break;
                case '3 bulan': date.setMonth(date.getMonth() + 3); break;
                case '6 bulan': date.setMonth(date.getMonth() + 6); break;
                case '1 tahun': date.setFullYear(date.getFullYear() + 1); break;
            }
            return date.toISOString().split('T')[0];
        }

        // Submit Form
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newData = {
                id: Date.now().toString(),
                team: document.getElementById('nama_team').value,
                nomor: document.getElementById('nomor_cust').value,
                email: document.getElementById('email_cust').value,
                durasi: document.getElementById('durasi').value,
                tglBeli: document.getElementById('tgl_beli').value,
                tglSelesai: hitungTglSelesai(document.getElementById('tgl_beli').value, document.getElementById('durasi').value)
            };

            dataCanva.push(newData);
            simpanDanRender();
            
            // Reset form text, tapi biarkan durasi & tanggal
            document.getElementById('nama_team').value = '';
            document.getElementById('nomor_cust').value = '';
            document.getElementById('email_cust').value = '';
        });

        // Copy Email ke Clipboard
        function copasEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                alert('🍓 Email berhasil di-copas: ' + email);
            }).catch(err => {
                console.error('Gagal copy text: ', err);
            });
        }

        // Hapus Data
        function hapusData(id) {
            if(confirm('Hapus data ini? 🥺')) {
                dataCanva = dataCanva.filter(item => item.id !== id);
                simpanDanRender();
            }
        }

        // Simpan ke Local Storage & Render UI
        function simpanDanRender() {
            localStorage.setItem('dataCanvaEurydice', JSON.stringify(dataCanva));
            renderData();
        }

        // Fungsi Utama untuk Menampilkan Data
        function renderData() {
            const dataArea = document.getElementById('dataArea');
            const notifArea = document.getElementById('notifArea');
            const notifList = document.getElementById('notifList');
            
            dataArea.innerHTML = '';
            notifList.innerHTML = '';
            
            const hariIni = new Date().toISOString().split('T')[0];
            let adaNotif = false;

            const urutanDurasi = ['1 bulan', '2 bulan', '3 bulan', '6 bulan', '1 tahun', 'lifetime'];

            urutanDurasi.forEach(dur => {
                const dataFilter = dataCanva.filter(item => item.durasi === dur);
                
                if (dataFilter.length > 0) {
                    // Buat wrapper kelompok
                    const groupDiv = document.createElement('div');
                    groupDiv.innerHTML = `<div class="group-title">⏳ Durasi: ${dur.toUpperCase()}</div>`;
                    
                    dataFilter.forEach(item => {
                        const isExpired = item.tglSelesai !== 'Lifetime' && item.tglSelesai <= hariIni;
                        
                        // HTML untuk Card Data
                        const cardHTML = `
                            <div class="data-item">
                                ${isExpired ? `<div class="expired-badge">🚨 WAKTUNYA KELUAR TEAM</div>` : ''}
                                <p><strong>Nama Team:</strong> ${item.team}</p>
                                <p><strong>Nomor Cust:</strong> ${item.nomor}</p>
                                <p><strong>Email Cust:</strong> ${item.email}</p>
                                <p><strong>Tgl Beli:</strong> ${item.tglBeli}</p>
                                <p><strong>Tgl Selesai:</strong> ${item.tglSelesai}</p>
                                <div class="action-buttons">
                                    <button class="btn-copy" onclick="copasEmail('${item.email}')">Copas Email 📋</button>
                                    <button class="btn-delete" onclick="hapusData('${item.id}')">Hapus 🗑️</button>
                                </div>
                            </div>
                        `;
                        
                        groupDiv.innerHTML += cardHTML;

                        // Jika Expired, masukkan juga ke kolom Notifikasi Atas
                        if (isExpired) {
                            adaNotif = true;
                            notifList.innerHTML += `
                                <div class="data-item" style="border-color: var(--danger); background: white;">
                                    <p><strong>Team:</strong> ${item.team}</p>
                                    <p><strong>Email:</strong> ${item.email}</p>
                                    <p><strong>Tgl Selesai:</strong> ${item.tglSelesai}</p>
                                    <div class="action-buttons">
                                        <button class="btn-copy" onclick="copasEmail('${item.email}')">Copas Email 📋</button>
                                        <button class="btn-delete" onclick="hapusData('${item.id}')">Hapus 🗑️</button>
                                    </div>
                                </div>
                            `;
                        }
                    });
                    
                    dataArea.appendChild(groupDiv);
                }
            });

            // Tampilkan/Sembunyikan Kolom Notifikasi
            notifArea.style.display = adaNotif ? 'block' : 'none';
        }

        // Render pertama kali saat web dibuka
        renderData();
    </script>
</body>
</html>
