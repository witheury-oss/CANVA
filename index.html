<!DOCTYPE html>
<html lang="id" data-theme="strawberry">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recap Canva Eurydice 🍓</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === TEMA LUCU === */
        :root[data-theme="strawberry"] {
            --bg-color: #ffe4e1;
            --container-bg: #fff0f5;
            --primary: #ff69b4;
            --secondary: #ffb6c1;
            --text: #c71585;
            --btn-text: #fff;
            --shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            --border: 2px dashed #ff69b4;
        }
        :root[data-theme="blueberry"] {
            --bg-color: #e6e6fa;
            --container-bg: #f8f8ff;
            --primary: #7b68ee;
            --secondary: #b0c4de;
            --text: #483d8b;
            --btn-text: #fff;
            --shadow: 0 4px 15px rgba(123, 104, 238, 0.2);
            --border: 2px dashed #7b68ee;
        }
        :root[data-theme="matcha"] {
            --bg-color: #f5fffa;
            --container-bg: #f0fff0;
            --primary: #3cb371;
            --secondary: #98fb98;
            --text: #2e8b57;
            --btn-text: #fff;
            --shadow: 0 4px 15px rgba(60, 179, 113, 0.2);
            --border: 2px dashed #3cb371;
        }

        /* === GLOBAL STYLES === */
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px; /* Space for bottom buttons */
            transition: all 0.3s ease;
        }
        h1, h2, h3 { text-align: center; }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: var(--border);
        }

        /* === FORM & INPUT === */
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--secondary);
            border-radius: 15px;
            font-family: 'Quicksand', sans-serif;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); }
        .info-text { font-size: 12px; color: var(--primary); }

        /* === DURATION BUTTONS === */
        .duration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }
        .btn-duration {
            background: var(--container-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-duration.active, .btn-duration:hover {
            background: var(--primary);
            color: var(--btn-text);
        }

        /* === ALERTS & NOTIFS === */
        .alert {
            background: #ffb3ba;
            color: #d1001f;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px dashed #ff4d4d;
        }
        .alert ul { margin: 10px 0 0 20px; padding: 0; }
        .btn-copas {
            background: #fff;
            color: #d1001f;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            font-weight: bold;
        }

        /* === CARDS / TABLE === */
        .data-card {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary);
            position: relative;
        }
        .data-card h4 { margin: 0 0 10px 0; color: var(--primary); }
        .data-card p { margin: 5px 0; font-size: 14px; }
        .badge {
            background: var(--secondary);
            color: var(--text);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-delete {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        /* === BOTTOM BUTTONS (STICKY) === */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--container-bg);
            padding: 15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            gap: 15px;
            box-sizing: border-box;
            border-top: var(--border);
            z-index: 1000;
        }
        .btn-cute {
            background: var(--primary);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .btn-cute:hover { transform: scale(1.05); }
        .btn-theme { background: var(--secondary); color: var(--text); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍓 Recap Canva Eurydice 🍓</h1>
        
        <!-- PENGINGAT (REMINDER) -->
        <div id="reminderSection" style="display: none;">
            <div class="alert">
                <strong>⚠️ Halo Kak! Ada langganan yang habis hari ini nih:</strong>
                <ul id="reminderList"></ul>
            </div>
        </div>

        <!-- FORM TAMBAH DATA -->
        <h3>✨ Tambah Data Baru ✨</h3>
        <div class="form-group">
            <label>Nomor Customer (Bisa isi banyak, pisahkan koma)</label>
            <input type="text" id="inputNomor" placeholder="0812xxx, 0857xxx">
        </div>
        <div class="form-group">
            <label>Email Customer (Bisa isi banyak, pisahkan koma)</label>
            <input type="text" id="inputEmail" placeholder="abc@gmail.com, def@gmail.com">
            <small class="info-text">*Fitur recap beberapa langsung: Pisahkan dengan koma untuk tambah banyak data sekaligus.</small>
        </div>
        <div class="form-group">
            <label>Nama Team Canva</label>
            <input type="text" id="inputTeam" placeholder="Eurydice Team 1">
        </div>
        <div class="form-group">
            <label>Tanggal Pembelian</label>
            <input type="date" id="inputTglBeli">
        </div>
        <div class="form-group">
            <label>Pilih Durasi ⏳</label>
            <div class="duration-grid" id="durationGrid">
                <button class="btn-duration" onclick="setDuration('1 Hari')">1 Hari</button>
                <button class="btn-duration" onclick="setDuration('3 Hari')">3 Hari</button>
                <button class="btn-duration" onclick="setDuration('7 Hari')">7 Hari</button>
                <button class="btn-duration" onclick="setDuration('1 Bulan')">1 Bulan</button>
                <button class="btn-duration" onclick="setDuration('2 Bulan')">2 Bulan</button>
                <button class="btn-duration" onclick="setDuration('3 Bulan')">3 Bulan</button>
                <button class="btn-duration" onclick="setDuration('6 Bulan')">6 Bulan</button>
                <button class="btn-duration" onclick="setDuration('1 Tahun')">1 Tahun</button>
                <button class="btn-duration" onclick="setDuration('Lifetime')">Lifetime</button>
            </div>
        </div>

        <hr style="border: 1px dashed var(--primary); margin: 30px 0;">

        <!-- FILTER & PENCARIAN -->
        <h3>🔍 Cari & Kelompokkan</h3>
        <div class="form-group">
            <input type="text" id="searchBox" placeholder="Cari email, nomor, atau team..." oninput="renderData()">
        </div>
        <div class="form-group">
            <select id="filterDurasi" onchange="renderData()">
                <option value="Semua">Semua Durasi</option>
                <option value="1 Hari">1 Hari</option>
                <option value="3 Hari">3 Hari</option>
                <option value="7 Hari">7 Hari</option>
                <option value="1 Bulan">1 Bulan</option>
                <option value="2 Bulan">2 Bulan</option>
                <option value="3 Bulan">3 Bulan</option>
                <option value="6 Bulan">6 Bulan</option>
                <option value="1 Tahun">1 Tahun</option>
                <option value="Lifetime">Lifetime</option>
            </select>
        </div>

        <!-- LIST DATA -->
        <div id="dataContainer"></div>
    </div>

    <!-- BOTTOM BUTTONS LUCU -->
    <div class="bottom-bar">
        <button class="btn-cute btn-theme" onclick="gantiTema()">🎨 Ganti Tema</button>
        <button class="btn-cute" onclick="simpanData()">💾 Simpan Data</button>
    </div>

    <script>
        let selectedDuration = "";
        let dataEurydice = JSON.parse(localStorage.getItem('dataEurydice')) || [];
        const themes = ['strawberry', 'blueberry', 'matcha'];
        let currentThemeIndex = 0;

        // Set default date to today
        document.getElementById('inputTglBeli').valueAsDate = new Date();

        function setDuration(durasi) {
            selectedDuration = durasi;
            document.querySelectorAll('.btn-duration').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === durasi) btn.classList.add('active');
            });
        }

        function gantiTema() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
        }

        function hitungTanggalSelesai(tglMulai, durasi) {
            if (durasi === 'Lifetime') return 'Lifetime 💖';
            let date = new Date(tglMulai);
            if(durasi === '1 Hari') date.setDate(date.getDate() + 1);
            if(durasi === '3 Hari') date.setDate(date.getDate() + 3);
            if(durasi === '7 Hari') date.setDate(date.getDate() + 7);
            if(durasi === '1 Bulan') date.setMonth(date.getMonth() + 1);
            if(durasi === '2 Bulan') date.setMonth(date.getMonth() + 2);
            if(durasi === '3 Bulan') date.setMonth(date.getMonth() + 3);
            if(durasi === '6 Bulan') date.setMonth(date.getMonth() + 6);
            if(durasi === '1 Tahun') date.setFullYear(date.getFullYear() + 1);
            return date.toISOString().split('T')[0];
        }

        function simpanData() {
            let nomorRaw = document.getElementById('inputNomor').value;
            let emailRaw = document.getElementById('inputEmail').value;
            let team = document.getElementById('inputTeam').value;
            let tglBeli = document.getElementById('inputTglBeli').value;

            if(!emailRaw || !team || !selectedDuration) {
                alert("Email, Team, dan Durasi wajib diisi ya kak! 🍓");
                return;
            }

            // Fitur RECAP BEBERAPA LANGSUNG (Split by comma)
            let emailArray = emailRaw.split(',').map(e => e.trim()).filter(e => e);
            let nomorArray = nomorRaw.split(',').map(n => n.trim()).filter(n => n);

            emailArray.forEach((email, index) => {
                let nomor = nomorArray[index] || (nomorArray[0] || "-"); // Assign number appropriately
                let tglSelesai = hitungTanggalSelesai(tglBeli, selectedDuration);
                
                dataEurydice.push({
                    id: Date.now() + Math.random(),
                    nomor: nomor,
                    email: email,
                    team: team,
                    tglBeli: tglBeli,
                    durasi: selectedDuration,
                    tglSelesai: tglSelesai
                });
            });

            localStorage.setItem('dataEurydice', JSON.stringify(dataEurydice));
            
            // Reset form
            document.getElementById('inputNomor').value = '';
            document.getElementById('inputEmail').value = '';
            document.querySelectorAll('.btn-duration').forEach(b => b.classList.remove('active'));
            selectedDuration = '';
            
            renderData();
            alert("Yeay! Data berhasil disimpan ✨");
        }

        function hapusData(id) {
            if(confirm("Yakin ingin menghapus data ini? 🥺")) {
                dataEurydice = dataEurydice.filter(d => d.id !== id);
                localStorage.setItem('dataEurydice', JSON.stringify(dataEurydice));
                renderData();
            }
        }

        function copasEmail(email) {
            navigator.clipboard.writeText(email);
            alert("Email " + email + " berhasil di-copy! Siap kirim pengingat 💌");
        }

        function checkReminders() {
            let today = new Date().toISOString().split('T')[0];
            let reminderList = document.getElementById('reminderList');
            let reminderSection = document.getElementById('reminderSection');
            reminderList.innerHTML = '';
            
            let adaReminder = false;
            dataEurydice.forEach(d => {
                if(d.tglSelesai === today) {
                    adaReminder = true;
                    let li = document.createElement('li');
                    li.innerHTML = `Email: <b>${d.email}</b> (Team: ${d.team}) 
                        <button class="btn-copas" onclick="copasEmail('${d.email}')">📋 Copas Email</button>`;
                    reminderList.appendChild(li);
                }
            });

            if(adaReminder) {
                reminderSection.style.display = 'block';
            } else {
                reminderSection.style.display = 'none';
            }
        }

        function renderData() {
            let container = document.getElementById('dataContainer');
            let search = document.getElementById('searchBox').value.toLowerCase();
            let filter = document.getElementById('filterDurasi').value;
            container.innerHTML = '';

            let filteredData = dataEurydice.filter(d => {
                let matchSearch = d.email.toLowerCase().includes(search) || 
                                  d.nomor.toLowerCase().includes(search) || 
                                  d.team.toLowerCase().includes(search);
                let matchFilter = filter === 'Semua' || d.durasi === filter;
                return matchSearch && matchFilter;
            });

            // Sort by tanggal selesai terdekat
            filteredData.sort((a, b) => new Date(a.tglSelesai) - new Date(b.tglSelesai));

            filteredData.forEach(d => {
                let card = document.createElement('div');
                card.className = 'data-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="hapusData(${d.id})">✖</button>
                    <h4>${d.team} <span class="badge">${d.durasi}</span></h4>
                    <p>📱 Nomor: <b>${d.nomor}</b></p>
                    <p>✉️ Email: <b>${d.email}</b></p>
                    <p>🗓️ Mulai: ${d.tglBeli} &nbsp;|&nbsp; 🏁 Selesai: <b>${d.tglSelesai}</b></p>
                `;
                container.appendChild(card);
            });

            checkReminders();
        }

        // Initial render
        renderData();
    </script>
</body>
</html>
